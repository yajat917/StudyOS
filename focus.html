<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode — StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar glass">
    <a href="index.html" class="logo"><span class="icon">📚</span><span class="gradient-text">StudyOS</span></a>
    <div class="nav-desktop nav-links">
      <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="planner.html">Planner</a>
      <a href="focus.html">Focus</a><a href="analytics.html">Analytics</a><a href="doubt.html">Doubt</a><a href="profile.html">Profile</a>
      <button class="theme-btn">🌙</button>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <button class="theme-btn">🌙</button><button class="menu-btn">☰</button>
    </div>
    <div class="mobile-menu" style="width:100%">
      <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="planner.html">Planner</a>
      <a href="focus.html">Focus</a><a href="analytics.html">Analytics</a><a href="doubt.html">Doubt</a><a href="profile.html">Profile</a>
    </div>
  </nav>

  <main class="container">
    <div class="timer-wrap">
      <h1 class="page-title">Focus Mode</h1>
      <p class="page-subtitle">Pomodoro timer — 25min work, 5min break</p>

      <div class="glass">
        <div class="timer-phase" id="phase-label">Ready</div>
        <div class="timer-ring">
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="8"/>
            <circle id="progress-ring" cx="110" cy="110" r="100" fill="none" stroke="#6366f1" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="628.32" stroke-dashoffset="628.32"/>
          </svg>
          <div class="timer-display" id="timer">25:00</div>
        </div>
        <div class="btn-group" style="justify-content:center;margin-top:0">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="pause-btn" class="btn btn-secondary hidden">Pause</button>
          <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
        <div class="today-focus-stats" style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border)">
          <div class="card-title" style="justify-content: center; font-size: 1rem; margin-bottom: 0.75rem">
            <span class="card-icon">🎯</span> Today's Focus
          </div>
          <div class="grid-2" style="gap: 1rem">
            <div class="glass" style="padding: 0.75rem; background: rgba(15, 23, 42, 0.3)">
              <div class="stat-value green" id="today-sessions" style="font-size: 1.5rem">0</div>
              <div class="stat-label" style="font-size: 0.75rem">Sessions</div>
            </div>
            <div class="glass" style="padding: 0.75rem; background: rgba(15, 23, 42, 0.3)">
              <div class="stat-value indigo" id="today-time" style="font-size: 1.5rem">0m</div>
              <div class="stat-label" style="font-size: 0.75rem">Total Time</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/focus.js"></script>
</body>
</html>
