<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — StudyOS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar glass">
    <a href="index.html" class="logo"><span class="icon">📚</span><span class="gradient-text">StudyOS</span></a>
    <div class="nav-desktop nav-links">
      <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="planner.html">Planner</a>
      <a href="focus.html">Focus</a><a href="analytics.html">Analytics</a><a href="doubt.html">Doubt</a><a href="profile.html">Profile</a>
      <button class="theme-btn">🌙</button>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <button class="theme-btn">🌙</button><button class="menu-btn">☰</button>
    </div>
    <div class="mobile-menu" style="width:100%">
      <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="planner.html">Planner</a>
      <a href="focus.html">Focus</a><a href="analytics.html">Analytics</a><a href="doubt.html">Doubt</a><a href="profile.html">Profile</a>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Profile Setup</h1>
    <p class="page-subtitle">Configure your study preferences. Data is saved in your browser.</p>

    <div style="max-width:640px;margin:0 auto">
      <div class="glass">
        <div id="alert" class="alert alert-success hidden"></div>

        <div class="grid-2">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="input" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="grade">Class / Grade</label>
            <input type="text" id="grade" class="input" placeholder="e.g. Class 12">
          </div>
        </div>

        <div class="form-group">
          <label>Subjects</label>
          <div class="pills" id="subjects"></div>
        </div>
        <div class="form-group">
          <label>Strengths</label>
          <div class="pills green" id="strengths"></div>
        </div>
        <div class="form-group">
          <label>Weaknesses</label>
          <div class="pills red" id="weaknesses"></div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="exam-date">Upcoming Exam Date</label>
            <input type="date" id="exam-date" class="input">
          </div>
          <div class="form-group">
            <label for="daily-hours">Daily Study Hours: <span id="hours-val">3</span>h</label>
            <input type="range" id="daily-hours" min="1" max="8" value="3">
          </div>
        </div>



        <button id="save-btn" class="btn btn-primary btn-block">Save Profile</button>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
